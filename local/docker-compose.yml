# Local full-stack dev environment: Postgres + Rust backend + React frontend (nginx).
#
#   docker compose -f dev/local/docker-compose.yml up --build
#
# See README.md. Build contexts reach the sibling repos via ../../; Postgres data and git
# repos are stored under ./.data (gitignored).
name: wiab-local

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wiab
      POSTGRES_PASSWORD: wiab
      POSTGRES_DB: wiab
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiab -d wiab"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    # Message broker between the backend and its agent teams. JetStream is on so a
    # durable work stream survives a broker restart; a team must not lose an issue
    # because NATS bounced.
    image: nats:2-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"   # client connections
      - "8222:8222"   # monitoring endpoints (/healthz, /varz)
    volumes:
      - ./.data/nats:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgres://wiab:wiab@db:5432/wiab
      WIAB_PERSISTENCE: postgres
      WIAB_MEDIASOUP_LISTEN_IP: 0.0.0.0
      WIAB_MEDIASOUP_ANNOUNCED_ADDRESS: 127.0.0.1
      WIAB_GIT_ROOT: /wiab-git
      WIAB_NATS_ENABLED: "true"
      WIAB_NATS_URL: nats://nats:4222
      # Local models (Llama LLM, Whisper STT). Fetch them first with
      # `backend/scripts/fetch-models.sh` into ~/.local/share/wiab (mounted below), then
      # export the enable flags + filenames before `docker compose up`. Default off so the
      # stack boots without model files present; an enabled-but-missing model aborts startup.
      WIAB_DATA_DIR: /var/lib/wiab
      WIAB_LLAMA_ENABLED: ${WIAB_LLAMA_ENABLED:-false}
      WIAB_WHISPER_ENABLED: ${WIAB_WHISPER_ENABLED:-false}
      WIAB_LLAMA_MODEL_FILE: ${WIAB_LLAMA_MODEL_FILE:-}
      WIAB_WHISPER_MODEL_FILE: ${WIAB_WHISPER_MODEL_FILE:-}
      RUST_LOG: wiab=info,tower_http=info,authbox_inf=info
      # Public origin the browser uses (drives cookie Secure, email + OIDC redirect URLs).
      WIAB_BASE_URL: http://localhost:3000
      # Enable self-service signup locally (shows the "Create an account" link). Off by default.
      WIAB_AUTH_LOCAL_SIGNUP: "true"
      # Email defaults to Resend (set RESEND_API_KEY + WIAB_EMAIL_FROM in oidc.env). To use
      # the bundled Mailpit catcher instead (view at http://localhost:8025), set
      # WIAB_EMAIL_PROVIDER=smtp in oidc.env — these SMTP vars then point at Mailpit.
      # NB: WIAB_EMAIL_FROM is intentionally NOT set here — `environment:` overrides
      # `env_file:`, so it must live in oidc.env to be usable by Resend (verified domain).
      WIAB_SMTP_HOST: mailpit
      WIAB_SMTP_PORT: "1025"
      # Enterprise SSO via the mock IdP is OFF by default. To try it, set
      # WIAB_AUTH_OIDC_ENABLED=true and point WIAB_OIDC_ISSUER at the mock — note the mock
      # must be reachable at the SAME host from both the browser and the backend (e.g. run
      # the backend on the host, or expose the mock via a shared hostname), since the issuer
      # in its discovery doc follows the request host.
    # Real Entra/OIDC credentials live in an untracked oidc.env (see oidc.env.example).
    # required: false → if the file is absent, enterprise SSO simply stays off.
    env_file:
      - path: ./oidc.env
        required: false
    ports:
      - "8080:8080"   # HTTPS API + WebSocket
      - "2222:2222"   # git SSH transport
    volumes:
      - ../../backend:/app
      - wiab-target:/app/target
      - wiab-cargo:/usr/local/cargo/registry
      - ./.data/git:/wiab-git
      - ${HOME}/.local/share/wiab:/var/lib/wiab
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
    # The first build compiles Rust + cmake native deps and can take tens of minutes, hence
    # the long start_period before the container is considered unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "curl -ksf https://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 1800s

  frontend:
    build:
      context: ../../frontend
      args:
        VITE_USE_STUB: "false"
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  # Catches outbound email (password-reset links). Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  # Mock OIDC provider for trying enterprise SSO locally (see the backend env note above).
  # Discovery: http://localhost:9090/default/.well-known/openid-configuration
  oidc-mock:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "9090:8080"

volumes:
  wiab-target:
  wiab-cargo:
